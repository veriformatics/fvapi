<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fvapi — Request strip</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><a class="brand" href="?state=catalog">fvapi</a><div><h1>Request strip</h1><p>Search is a service. Trust stays with you.</p></div><span class="host">vflab<br><small>API v0 / prototype</small></span></header>
<main class="strip"><section class="row compose"><div class="stamp">Next<br>request<span class="dot"></span></div><div class="row-body"><div class="section-head"><h2>Choose a proof. Send an input.</h2><a href="#history">Read earlier requests</a></div><div class="tray"><div><label>Library entry</label><div id="catalog" class="catalog"></div><form id="lookup"><label for="query">Specification to look up</label><div class="inline"><input id="query" value="vf.contrast-2x2" required><button>Look up</button></div></form></div><div class="input-tray"><div class="section-head"><label for="input">Checker input / JSON</label><button type="button" id="example">Load example</button></div><textarea id="input" spellcheck="false" aria-describedby="input-note"></textarea><div class="inline"><button class="primary" id="run">Run check</button><span id="input-note"></span></div></div></div><p id="connection" role="status"></p></div></section>
<section id="current" class="row"></section><section id="history" class="history"><div class="row"><div class="stamp">Earlier<span class="dot"></span></div><div class="row-body section-head"><h2>Recorded requests</h2><div class="filters" aria-label="Request filters"><button data-filter="all" aria-pressed="true">All requests</button><button data-filter="answers" aria-pressed="false">Answers</button><button data-filter="demand" aria-pressed="false">Demand</button></div></div></div><div id="counts"></div><div id="records"></div></section><footer>Read the statement. Download the closure. Re-run the proof yourself.</footer></main></body></html>
