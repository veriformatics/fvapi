<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fvapi / terminal</title><link rel="stylesheet" href="terminal.css"></head>
<body>
<header><h1>fvapi<span> / terminal</span></h1><span id="health">Connecting to API…</span></header>
<nav aria-label="Commands"><button data-command="catalog">catalog</button><button data-command="show vf.contrast-2x2">show</button><button data-command="lookup --spec vf.contrast-2x2">lookup</button><button data-command="check vf.contrast-2x2">check</button><button data-command="demand">demand</button><button data-command="answers">answers</button><button data-command="help">help</button></nav>
<main id="buffer" tabindex="0" aria-label="Command output"><div class="intro"><span class="good">Connected tools. Independent proofs.</span><p>Search the library. Read the claim. Take the proof with you.</p><p class="muted">The server's answer is a lead, not a reason to trust it.</p></div><div id="output" aria-live="polite"></div></main>
<section class="prompt"><form id="command-form"><label for="command">fvapi $</label><input id="command" autocomplete="off" spellcheck="false" placeholder="Type a command, or start with help" aria-label="fvapi command"><button type="submit">Run</button></form><div class="hints"><span>Tab complete</span><span>↑↓ history</span><span>Enter run</span><span id="completions"></span></div></section>
<footer><span id="status">API v0 / ready</span><span>Search, never trust.</span></footer>
<script src="terminal.js"></script></body></html>
